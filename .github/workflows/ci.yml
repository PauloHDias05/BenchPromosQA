name: End-to-end tests

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cypress-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          headless: true
          config-file: cypress.config.js

        env:
          LANG: pt_BR.UTF-8
          LANGUAGE: pt_BR:pt
          LC_ALL: pt_BR.UTF-8

          CYPRESS_urlbase: ${{ secrets.URLBASE }}
          CYPRESS_email_invalido: ${{ secrets.EMAIL_INVALIDO }}
          CYPRESS_email_padrao: ${{ secrets.EMAIL_PADRAO }}
          CYPRESS_senha_padrao: ${{ secrets.SENHA_PADRAO }}
          CYPRESS_senha_menor8: ${{ secrets.SENHA_MENOR8 }}
          CYPRESS_senha_errada: ${{ secrets.SENHA_ERRADA }}
          CYPRESS_nome: ${{ secrets.NOME }}

          CYPRESS_login: '{"username":"${{ secrets.USERNAME }}","password":"${{ secrets.PASSWORD }}","password2":"${{ secrets.PASSWORD2 }}"}'

    
      - name: Upload Cypress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-reports
          path: cypress/reports
          if-no-files-found: ignore

      
      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

     
      - name: Upload report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: cypress/reports

  deploy-report:
    needs: cypress-run

    
    if: always()

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4