name: End-to-end tests
on: push
jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          headless: true
          config-file: cypress.config.js
        env:
          CYPRESS_urlbase: ${{ secrets.URLBASE }}
          CYPRESS_email_invalido: ${{ secrets.EMAIL_INVALIDO }}
          CYPRESS_email_padrao: ${{ secrets.EMAIL_PADRAO }}
          CYPRESS_senha_padrao: ${{ secrets.SENHA_PADRAO }}
          CYPRESS_senha_menor8: ${{ secrets.SENHA_MENOR8 }}
          CYPRESS_senha_errada: ${{ secrets.SENHA_ERRADA }}
          CYPRESS_nome: ${{ secrets.NOME}}
          CYPRESS_login: '{"username":"${{ secrets.LOGIN_USERNAME }}","password":"${{ secrets.LOGIN_PASSWORD }}"}'    

      - uses: actions/upload-artifact@v7
       
        if: failure()
        with:
          name: cypress-reports
          path: cypress/reports
          if-no-files-found: ignore 
      - uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

        